services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zelatan-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database Supabase
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-aws-0-ap-southeast-1.pooler.supabase.com}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-zelatan_app.mevzhxisbubhlnvwamje}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}

      # Domain / URL Produksi
      APP_BASE_URL: ${APP_BASE_URL:-https://stinging-usual-risotto.ngrok-free.dev}
      APP_URL: ${APP_URL:-https://stinging-usual-risotto.ngrok-free.dev}

      # Xendit Payment Gateway
      XENDIT_API_KEY: ${XENDIT_API_KEY}
      XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN}
      XENDIT_BASE_URL: ${XENDIT_BASE_URL:-https://api.xendit.co}

      # Admin Awal
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Hanif18}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Email SMTP
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}

      # Google OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # OpenRouter AI Chat
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
    networks:
      - zelatan-net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: zelatan-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "app:8080"
      - "--url=${NGROK_URL:-https://stinging-usual-risotto.ngrok-free.dev}"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-3H5HraogcidhEkQvES4bB16dBmP_2famCtzKyuJTtoJPojLGN}
    depends_on:
      - app
    networks:
      - zelatan-net

networks:
  zelatan-net:
    driver: bridge
